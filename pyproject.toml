[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ccc = "ccc.cli:main"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # formatter handles code line length; don't lint string content
